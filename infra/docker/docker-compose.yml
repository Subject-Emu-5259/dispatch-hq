version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: dispatch-hq-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dispatch_hq
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch_dev_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch_hq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dispatch-hq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
