# Dispatch HQ — electron-builder config
# Build all platforms with: pnpm --filter @dispatch-hq/desktop publish:desktop
# (or bash apps/desktop/scripts/build-release.sh from the repo root).
appId: com.dispatchhq.desktop
productName: Dispatch HQ
copyright: Copyright © 2026 Dispatch HQ

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - package.json

# ── Bundled game (v0.4.1) ─────────────────────────────────────────────────────
# The desktop app ships the real game client, not a web wrapper: the
# apps/web build (desktop mode — production API/WS endpoints baked in; see
# scripts/stage-web.mjs) is staged into web-dist/ and carried as a resource,
# alongside the offline page the shell shows when the server is unreachable.
extraResources:
  - from: web-dist
    to: web-dist
  - from: assets/offline.html
    to: offline.html

# ── OTA updates (electron-updater) ────────────────────────────────────────────
# GitHub Releases feed: electron-builder embeds this provider into the
# packaged app's app-update.yml, and releases published with the artifacts
# + latest*.yml files become the update channel (check/download/apply is
# wired in src/main.ts). NOTE: this repo's VM checkout has no git remote
# configured — owner/repo below follow the GitHub account that hosts the
# project (Subject-Emu-5259) and the repo/package name (dispatch-hq).
# Confirm before the first --publish run; a wrong value only breaks the
# feed lookup, which the app treats as "no update" and logs.
publish:
  provider: github
  owner: Subject-Emu-5259
  repo: dispatch-hq

# ── macOS ─────────────────────────────────────────────────────────────────────
# Universal binary (Apple Silicon + Intel) DMG for distribution, plus the zip
# (the zip is what the native auto-updater consumes — see docs/DESKTOP.md
# "Updates"). `--universal` on the CLI is required for
# electron-builder to honour the universal arch; build-release.sh passes it.
#
# Signing + notarization are env-driven and auto-detected:
#   - CSC_NAME / CSC_LINK (+ CSC_KEY_PASSWORD): Developer ID cert to sign with.
#   - APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID: notarize + staple.
# build-release.sh passes -c.mac.identity=null when no identity exists (ad-hoc
# build) and -c.notarize=true only when all three Apple creds are present, so
# the pipeline never hard-fails on an unsigned machine.
mac:
  category: public.app-category.games
  target:
    - dmg
    - zip
  artifactName: DispatchHQ-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  title: "Dispatch HQ ${version}"
  window:
    width: 540
    height: 380

# ── Windows ───────────────────────────────────────────────────────────────────
# NSIS installer (x64). Building the Windows target from macOS works for
# unsigned installers. Windows code-signing (Authenticode, SmartScreen)
# is env-driven like macOS:
#   - CSC_LINK (+ CSC_KEY_PASSWORD): code-signing cert to sign with
#   - WIN_CSC_LINK (+ WIN_CSC_KEY_PASSWORD): same, Windows-specific override
# electron-builder signs the installer automatically when a cert is present.
# On macOS a Windows signing cert also needs wine/signtool; a Windows CI
# runner is the friction-free path (see docs/DESKTOP.md "Signing").
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: DispatchHQ-${version}-${arch}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: Dispatch HQ

# ── Linux ─────────────────────────────────────────────────────────────────────
# AppImage (x64) — a portable, no-install binary for most distros.
linux:
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: DispatchHQ-${version}-${arch}.${ext}
  category: Game
  synopsis: Emergency dispatch simulation
  maintainer: deandrewharris@gmail.com

npmRebuild: false
