  <body class="bg-gray-950 text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').catch(() => {});
        });
        // Self-healing cache (v0.23.6): when a deploy ships a new service
        // worker, it notifies the page (DHQ_UPDATE_READY) and we reload ONCE so
        // the fresh bundle loads — a stale-cache map (black/blank after a bad
        // deploy) fixes itself without a manual hard refresh. Guarded so the
        // very first install (no prior controller) never triggers a spurious
        // reload.
        let refreshing = false;
        const reloadOnce = () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        };
        if (navigator.serviceWorker.controller) {
          // A service worker already controls this page — a controllerchange
          // means a newer one took over after an update.
          navigator.serviceWorker.addEventListener('controllerchange', reloadOnce);
        }
        navigator.serviceWorker.addEventListener('message', (e) => {
          if (e.data && e.data.type === 'DHQ_UPDATE_READY') reloadOnce();
        });
      }
    </script>
  </body>
